name: verify
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      keycloak_version:
        description: Additional Keycloak release to test with the existing provider
        required: false
        type: string
# PR builds execute untrusted code. Keep this workflow isolated from release credentials.
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  versions:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      keycloak: ${{ steps.matrix.outputs.keycloak }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: matrix
        env:
          CANDIDATE_KEYCLOAK: ${{ inputs.keycloak_version }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          versions = json.loads(Path("config/keycloak-versions.json").read_text())
          candidate = os.environ.get("CANDIDATE_KEYCLOAK", "").strip()
          if candidate:
              versions.append(candidate)
          if not versions or any(not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", v) for v in versions):
              raise SystemExit("Keycloak versions must be explicit major.minor.patch releases")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("keycloak=" + json.dumps(list(dict.fromkeys(versions))) + "\n")
          PY
  test:
    needs: versions
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        keycloak: ${{ fromJSON(needs.versions.outputs.keycloak) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify provider, cluster recovery and persisted-outbox upgrade
        env:
          KEYCLOAK_RUNTIME_VERSION: ${{ matrix.keycloak }}
        run: mvn -B -ntp -Pintegration "-Dkeycloak.runtime.version=$KEYCLOAK_RUNTIME_VERSION" verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: test-results-and-jars-kc-${{ matrix.keycloak }}
          retention-days: 7
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            integration-tests/target/*.log
            extension/target/keycloak-nats-durable-*.jar
            consumer-example/target/consumer-example-*.jar
  postgres-compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # PostgreSQL 18 runs the full Keycloak matrix above. Track supported older major lines too.
        postgres: ['14', '15', '16', '17']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify older PostgreSQL with the current Keycloak baseline
        env:
          POSTGRES_MAJOR: ${{ matrix.postgres }}
        run: >-
          mvn -B -ntp -Pintegration "-Dpostgres.image=postgres:$POSTGRES_MAJOR-alpine"
          '-Dit.test=ConsumerHardeningIT,CustomSchemaIT,UpgradeIT,DurabilityIT#uncommittedAndRolledBackRowsAreNeverPublished+outboxWritesKeepSynchronousCommitForAuthenticationOnlyTransactions+retriesDoNotRewritePayloadAndVacuumSettingsAreInstalled'
          verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: postgres-compatibility-${{ matrix.postgres }}
          retention-days: 7
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            integration-tests/target/*.log
