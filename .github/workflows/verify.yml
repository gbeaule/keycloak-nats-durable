name: verify
on:
  push:
    branches: [main]
    # Keep PR checks present for branch protection; only filter post-merge runs.
    # docs/examples/*.json are test fixtures and must still trigger verification.
    paths-ignore:
      - '**/*.md'
      - LICENSE
  pull_request:
  workflow_dispatch:
    inputs:
      keycloak_version:
        description: Additional Keycloak release to test with the existing provider
        required: false
        type: string
# PR builds execute untrusted code. Keep this workflow isolated from release credentials.
permissions:
  contents: read
concurrency:
  group: verify-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.keycloak_version }}
  cancel-in-progress: true
jobs:
  quick-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Validate compatibility matrix
        id: matrix
        env:
          CANDIDATE_KEYCLOAK: ${{ inputs.keycloak_version }}
        run: |
          matrix=$(python3 scripts/validate.py matrix-json --keycloak-version "$CANDIDATE_KEYCLOAK")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Unit tests, style, packaging and validation tooling
        run: python3 scripts/validate.py quick
      - name: Unit coverage reports
        uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: unit-coverage
          retention-days: 3
          path: '**/target/site/jacoco-unit/**'
      - uses: actions/upload-artifact@v7.0.1
        if: failure()
        with:
          name: quick-check-results
          retention-days: 3
          path: '**/target/surefire-reports/**'
  test:
    needs: quick-checks
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: true
      matrix:
        keycloak: ${{ fromJSON(needs.quick-checks.outputs.matrix).keycloak }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify provider, cluster recovery and persisted-outbox upgrade
        env:
          KEYCLOAK_RUNTIME_VERSION: ${{ matrix.keycloak }}
        run: python3 scripts/validate.py integration --keycloak-version "$KEYCLOAK_RUNTIME_VERSION"
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: test-results-kc-${{ matrix.keycloak }}
          retention-days: 3
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            integration-tests/target/*.log
  postgres-compatibility:
    needs: quick-checks
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: true
      matrix:
        # PostgreSQL 18 runs the full Keycloak matrix above. Track supported older major lines too.
        postgres: ${{ fromJSON(needs.quick-checks.outputs.matrix).postgres }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify older PostgreSQL with the current Keycloak baseline
        env:
          POSTGRES_MAJOR: ${{ matrix.postgres }}
        run: python3 scripts/validate.py postgres --postgres-major "$POSTGRES_MAJOR"
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: postgres-compatibility-${{ matrix.postgres }}
          retention-days: 3
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            integration-tests/target/*.log
