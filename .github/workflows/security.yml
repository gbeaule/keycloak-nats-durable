name: security
on:
  push:
  pull_request:
  schedule:
    # Every Monday at 08:17 UTC (minute, hour, day of month, month, day of week).
    - cron: '17 8 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  dependencies-and-images:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify release tooling
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Build artifacts and inventory
        run: mvn -B -ntp -Psbom verify
      - name: Scan dependencies and deployment images
        run: python3 scripts/security-check.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: security-${{ github.sha }}-${{ github.run_id }}
          retention-days: 30
          path: |
            **/target/bom.json
            **/target/runtime-bom.json
            target/security/*.json
