name: security
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - LICENSE
  schedule:
    # Every Monday at 08:17 UTC (minute, hour, day of month, month, day of week).
    - cron: '17 8 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dependencies-and-images:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build inventories and scan dependencies and deployment images
        run: python3 scripts/validate.py security
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: security-${{ github.sha }}-${{ github.run_id }}
          retention-days: 7
          path: |
            **/target/bom.json
            **/target/runtime-bom.json
            target/security/*.json
